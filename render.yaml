services:
  - type: web
    name: ringback
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: LLM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: ringback
      - key: EMBEDDING_PROVIDER
        value: keyword
      - key: TEMPORAL_TASK_QUEUE
        value: ringback
